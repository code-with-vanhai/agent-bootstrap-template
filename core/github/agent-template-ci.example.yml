name: Agent System

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-agent-system:
    name: Validate agent system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve validation base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "AGENT_VALIDATE_BASE_REF=$(git merge-base HEAD origin/${{ github.base_ref }})" >> "$GITHUB_ENV"
          else
            echo "AGENT_VALIDATE_BASE_REF=HEAD~1" >> "$GITHUB_ENV"
          fi

      - name: Validate generated agent files
        run: bash scripts/agent-validate.sh --changed-only

      - name: Run fast gate when configured
        run: |
          set +e
          bash scripts/agent-eval.sh fast
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "fast gate is not configured in this repository yet; validation already checked the generated agent system."
            exit 0
          fi
          exit "$rc"
