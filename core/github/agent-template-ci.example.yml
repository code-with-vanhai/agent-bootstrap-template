name: Agent System

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-agent-system:
    name: Validate agent system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate generated agent files
        run: bash scripts/agent-validate.sh

      - name: Run fast gate when configured
        run: |
          set +e
          bash scripts/agent-eval.sh fast
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "fast gate is not configured in this repository yet; validation already checked the generated agent system."
            exit 0
          fi
          exit "$rc"
