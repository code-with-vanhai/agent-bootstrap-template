name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n bin/agent-bootstrap
          bash -n scripts/bootstrap-request.sh
          for f in scripts/lib/bootstrap/*.sh; do
            bash -n "$f"
          done
          for f in scripts/*.sh tests/evals/*.sh tests/lib/*.sh tests/migrations/*/run.sh; do
            bash -n "$f"
          done

      - name: Bootstrap dry-run output stable
        run: bash tests/lib/test_bootstrap_dry_run_stable.sh

      - name: Template validator
        run: bash scripts/agent-validate.sh

      - name: Python unit tests
        run: |
          python3 -m unittest scripts.lib.test_gate_discovery
          python3 -m unittest scripts.lib.test_validate_agent_system
          python3 -m unittest scripts.lib.test_render_template
          python3 -m unittest scripts.lib.test_validate_plan
          python3 -m unittest scripts.lib.test_audit_log
          python3 -m unittest scripts.lib.test_insert_gate_candidates
          python3 -m unittest scripts.lib.test_check_test_module_coverage
          python3 -m unittest scripts.lib.test_gate_modes
          python3 -m unittest scripts.lib.test_check_version_consistency
          python3 -m unittest scripts.lib.test_validate_mcp_config
          python3 -m unittest scripts.lib.test_bump_version
          python3 -m unittest scripts.lib.test_doctor
          python3 -m unittest scripts.lib.test_agent_sync_versions
          python3 -m unittest scripts.lib.test_scaffold_migration
          python3 -m unittest scripts.lib.test_check_conventional_commits
          python3 -m unittest scripts.lib.test_release_prepare

      - name: Python unit tests (tests/lib)
        run: python3 -m unittest discover -s tests/lib -p 'test_*.py' -t .

      - name: All Python test modules are gated
        run: python3 scripts/lib/check_test_module_coverage.py .github/workflows/ci.yml

      - name: Provider helper tests
        run: bash tests/lib/test_llm_provider.sh

      - name: Eval artifact tests
        run: bash tests/lib/test_agent_evals_artifacts.sh

      - name: Secret-guard hook tests
        run: bash tests/lib/test_secret_guard_hook.sh

      - name: Rulebase-guard hook tests
        run: bash tests/lib/test_rulebase_guard_hook.sh

      - name: Deterministic evals
        run: bash scripts/agent-evals.sh --fast

  migration-fixtures:
    name: Migration fixtures (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags required: migration fixtures use `git show v0.8.0:...` etc.
          # to assert backward-compatibility against historical releases.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Migration fixtures
        run: |
          set -euo pipefail
          for f in tests/migrations/*/run.sh; do
            bash "$f"
          done

  version-consistency:
    name: Version consistency (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Versions agree across plugin/marketplace/bootstrap/changelog
        run: python3 scripts/lib/check_version_consistency.py --strict

  conventional-commits:
    # Stage 3.4: enforce Conventional Commits on every PR commit. PRs
    # only — push-to-main does not run this job because main itself
    # may carry historical non-conformant subjects from before this
    # gate landed. The release-process docs forbid silent tag pushes,
    # so this checker is read-only by construction.
    name: Conventional commits (PR only)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check PR commits
        run: |
          python3 scripts/lib/check_conventional_commits.py \
            --repo . \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
